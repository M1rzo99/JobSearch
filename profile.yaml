# Sizning profilingiz. Bot e'lonlarni shu ma'lumotlar bo'yicha tanlaydi va ariza yozadi.
# <...> belgilarini o'zingizning ma'lumotlaringiz bilan almashtiring.

name_ko: "<이름>"            # koreyscha ism
name_en: "<Ism Familiya>"
phone: "<010-0000-0000>"
email: "<sizning@gmail.com>"   # ariza shu manzildan yuboriladi (SMTP_USER bilan bir xil)
location: "<서울>"            # hozir yashash joyi
visa: "<F-2>"                 # viza turi
topik: "<6급>"
languages: ["우즈베크어 (모국어)", "한국어", "러시아어"]
summary_ko: >
  우즈베크어-한국어 통번역 경험을 바탕으로 한국과 우즈베키스탄 간 비즈니스,
  계약, 현장 통역을 정확하게 지원할 수 있습니다.

# Arizaga biriktiriladigan fayllar (data/files/ papkasiga joylang)
attachments:
  - data/files/resume_ko.pdf
  # - data/files/cover_letter_ko.pdf
  # - data/files/topik.pdf

# Qidiruv so'zlari (har bir sayt uchun shu so'zlar bilan qidiriladi)
search_queries:
  - 우즈베크어
  - 우즈베크어 통역
  - 우즈베크어 번역
  - 우즈베키스탄
  - 우즈벡
  - 우즈베키스탄 IT
  - 외국인 개발자
  - 외국인 IT

# Faqat shu 3 toifaga tushgan e'lonlar ko'rsatiladi.
# "all" ichidagi har bir guruhdan kamida bitta so'z topilishi kerak.
categories:
  "Tarjima":
    all:
      - [통역, 번역, 통번역, 통역사, 번역가, interpreter, translator, translation]
      - [우즈베크, 우즈벡, 우즈베키스탄, Uzbek, Uzbekistan]
  "Hamkorlik":
    all:
      - [우즈베키스탄, 우즈베크, 우즈벡, 타슈켄트, Uzbekistan, Uzbek, Tashkent]
  "IT":
    title_only: true
    all:
      - [개발자, 백엔드, 프론트엔드, 풀스택, 소프트웨어, 웹개발, 앱개발, 데이터 엔지니어, 데이터 분석, 데브옵스, 퍼블리셔, IT, QA, developer, engineer, frontend, backend, fullstack, DevOps, software]

# Tartiblash uchun ballar (yulduzlar soni)
keywords:
  우즈베크: 5
  우즈벡: 5
  우즈베키스탄: 5
  Uzbek: 5
  타슈켄트: 4
  통역: 3
  번역: 3
  통번역: 3
  외국인: 2
  IT: 2
  개발자: 2

# Sarlavhada shu so'zlar bo'lsa e'lon umuman ko'rsatilmaydi
exclude:
  - 영업
  - 세일즈
  - sales
  - 텔레마케팅
  - 일본어
  - 중국어
  - 베트남어
